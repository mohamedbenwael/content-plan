/* Background push to Supabase. Returns true on confirmed success, false on failure.
   Most callers don't await this (local cache already updated so UI never waits), but callers that
   need to know whether the save actually reached the server (e.g. adding a reviewer) can await it
   and warn the user on failure instead of silently losing data on the next reload/sync. */
async function pushRow(table, row) {
  if (!sbClient) return true; // local-only mode; nothing to sync against
  try {
    const { error } = await sbClient.from(table).upsert(row);
    if (error) { console.error(table, 'upsert error', error); return false; }
    return true;
  } catch (e) { console.error(table, 'upsert exception', e); return false; }
}
async function pushDelete(table, id) {
  if (!sbClient) return true;
  try {
    const { error } = await sbClient.from(table).delete().eq('id', id);
    if (error) { console.error(table, 'delete error', error); return false; }
    return true;
  } catch (e) { console.error(table, 'delete exception', e); return false; }
}

/* Pull everything from Supabase into the local cache (used on load and on realtime updates) */
async function pullAllFromSupabase() {
  if (!sbClient) return false;
  try {
    const [u, t, r, s, tp] = await Promise.all([
      sbClient.from('users').select('*'),
      sbClient.from('tasks').select('*'),
      sbClient.from('reviewers').select('*'),
      sbClient.from('submissions').select('*'),
      sbClient.from('teacher_pages').select('*'),
    ]);
    if (!u.error && u.data) saveJSON(KEYS.users, u.data.map(Map_.rowToUser));
    if (!t.error && t.data) saveJSON(KEYS.tasks, t.data.map(Map_.rowToTask));
    if (!r.error && r.data) saveJSON(KEYS.reviewers, r.data.map(Map_.rowToReviewer));
    if (!s.error && s.data) saveJSON(KEYS.submissions, s.data.map(Map_.rowToSubmission));
    if (!tp.error && tp.data) saveJSON(KEYS.teacherPages, tp.data.map(Map_.rowToTeacherPage));
    return true;
  } catch (e) { console.error('pullAllFromSupabase failed', e); return false; }
}

const DB = {
  getUsers() { return loadJSON(KEYS.users, []); },
  saveUsers(u) { saveJSON(KEYS.users, u); },
  upsertUser(user) {
    const users = this.getUsers();
    const i = users.findIndex(u => u.id === user.id);
    if (i >= 0) users[i] = user; else users.push(user);
    this.saveUsers(users);
    return pushRow('users', Map_.userToRow(user));
  },
  deleteUser(id) {
    this.saveUsers(this.getUsers().filter(u => u.id !== id));

function normalizePhoneForWhatsapp(phone) {
  let digits = String(phone || '').replace(/[^0-9]/g, '');
  if (!digits) return '';
  if (digits.startsWith('0020')) digits = digits.slice(2);      // 0020xxxxxxxxxx -> 20xxxxxxxxxx
  else if (digits.startsWith('20') && digits.length >= 12) { /* already has country code */ }
  else if (digits.startsWith('0')) digits = '20' + digits.slice(1); // 01xxxxxxxxx -> 201xxxxxxxxx
  else if (digits.length === 10 || digits.length === 11) digits = '20' + digits; // missing leading 0 and code
  return digits;
}

async function handleProfilePhotoSelected(e, userId) {
  const file = e.target.files && e.target.files[0];
  const statusEl = document.getElementById('profile-photo-status');
  if (!file) return;
  if (statusEl) { statusEl.textContent = 'جاري ضغط الصورة...'; statusEl.className = 'text-xs text-gray-500 mt-2'; }
  try {
    const compressed = await compressImageFile(file);
    if (compressed && compressed.length > PHOTO_MAX_BASE64_CHARS) {
      if (statusEl) { statusEl.textContent = 'الصورة كبيرة جداً حتى بعد الضغط، من فضلك اختار صورة أصغر أو أبسط.'; statusEl.className = 'text-xs text-danger mt-2 font-medium'; }
      e.target.value = '';
      return;
    }
    const users = DB.getUsers();
    const u = users.find(x => x.id === userId);
    if (u) { u.photo = compressed || ''; DB.upsertUser(u); }

    if (statusEl) { statusEl.textContent = 'تعذر تجهيز الصورة، جرب صورة تانية.'; statusEl.className = 'text-xs text-danger mt-2 font-medium'; }

  }

/* ---------------------------- Image compression (client-side, before upload) ---------------------------- */
const PHOTO_MAX_DIMENSION = 480;      // أقصى عرض/ارتفاع للصورة بعد الضغط (بكسل)
const PHOTO_JPEG_QUALITY = 0.72;      // جودة الضغط
const PHOTO_MAX_BASE64_CHARS = 220000; // ≈ 160KB تقريباً بعد الترميز — سقف الأمان لخطة Supabase المجانية

function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!file) { resolve(null); return; }
    if (!file.type || file.type.indexOf('image/') !== 0) { reject(new Error('الملف المختار مش صورة')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('تعذرت قراءة الصورة'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('تعذر فتح الصورة'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h) { if (w > PHOTO_MAX_DIMENSION) { h = Math.round(h * PHOTO_MAX_DIMENSION / w); w = PHOTO_MAX_DIMENSION; } }
        else { if (h > PHOTO_MAX_DIMENSION) { w = Math.round(w * PHOTO_MAX_DIMENSION / h); h = PHOTO_MAX_DIMENSION; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', PHOTO_JPEG_QUALITY));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let activeInterval = null;
function clearTimers() { if (activeInterval) { clearInterval(activeInterval); activeInterval = null; } }

/* Re-render while trying to preserve focus/caret in the active input */
function rerender() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  render();
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

/* ---------------------------- Router ---------------------------- */
function navigate(hash) { location.hash = '#' + hash; }
function currentRoute() { return location.hash.replace(/^#/, '') || '/'; }

function render() {
  clearTimers();
  const route = currentRoute();
  const user = getCurrentUser();
  const app = document.getElementById('app');

  if (route === '/') {
    app.innerHTML = renderLogin();
    return;
  }
  if (route === '/dashboard') {
    if (!user || user.role !== 'candidate') { navigate('/'); return; }
    app.innerHTML = renderCandidateDashboard(user) + renderProfileModal();
    startCandidateTimer(user);
    return;
  }
  if (route.indexOf('/admin') === 0) {
    if (!user || user.role !== 'admin') { navigate('/'); return; }
    app.innerHTML = renderAdminLayout(route) + renderProfileModal();
    return;
  }
  if (route === '/reviewer') {
    if (!user || user.role !== 'reviewer') { navigate('/'); return; }
    app.innerHTML = renderReviewerDashboard(user) + renderProfileModal();
    return;
  }
  if (route === '/account-manager') {
    if (!user || user.role !== 'account_manager') { navigate('/'); return; }
    app.innerHTML = renderAccountManagerDashboard(user) + renderProfileModal();
    return;
  }
  navigate('/');
}

  }
  seedDB();
  render();

  /* Live sync: when data changes on another device, pull the latest and re-render */
  if (sbClient) {
    try {
      const channel = sbClient.channel('atoz-sync-channel');
      ['users', 'tasks', 'reviewers', 'submissions', 'teacher_pages'].forEach(function (table) {
        channel.on('postgres_changes', { event: '*', schema: 'public', table: table }, async function () {
          await pullAllFromSupabase();
          rerender();
        });
      });
      channel.subscribe();
    } catch (e) {
      console.error('Realtime subscription failed.', e);
    }
  }
});

async function handlePhotoSelected(e) {
  const file = e.target.files && e.target.files[0];
  const statusEl = document.getElementById('reg-photo-status');
  const previewEl = document.getElementById('reg-photo-preview');
  UI.login.photoData = '';
  if (!file) { if (statusEl) statusEl.textContent = 'هيتم ضغط الصورة تلقائياً قبل الإرسال. لو الصورة كبيرة جداً هتتطلب صورة أصغر.'; if (previewEl) previewEl.innerHTML = ''; return; }
  if (statusEl) { statusEl.textContent = 'جاري تجهيز الصورة...'; statusEl.className = 'text-xs text-gray-500 mt-2'; }
  try {
    const compressed = await compressImageFile(file);
    if (compressed && compressed.length > PHOTO_MAX_BASE64_CHARS) {
      UI.login.photoData = '';
      if (statusEl) { statusEl.textContent = 'الصورة كبيرة جداً حتى بعد الضغط، من فضلك اختار صورة أصغر أو أبسط.'; statusEl.className = 'text-xs text-danger mt-2 font-medium'; }
      if (previewEl) previewEl.innerHTML = '';
      e.target.value = '';
      return;
    }
    UI.login.photoData = compressed || '';
    if (statusEl) { statusEl.textContent = 'تم تجهيز الصورة بنجاح ✓'; statusEl.className = 'text-xs text-success mt-2 font-medium'; }
    if (previewEl) previewEl.innerHTML = '<img src="' + compressed + '" class="w-20 h-20 rounded-full object-cover border border-gray-200">';
  } catch (err) {
    UI.login.photoData = '';
    if (statusEl) { statusEl.textContent = 'تعذر تجهيز الصورة، جرب صورة تانية.'; statusEl.className = 'text-xs text-danger mt-2 font-medium'; }
    e.target.value = '';
  }
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const L = UI.login;
  L.error = ''; L.successMsg = '';
  const phone = (document.getElementById('auth-phone').value || '').trim();
  const password = (document.getElementById('auth-password').value || '').trim();
  let users = DB.getUsers();

  if (L.isLogin) {
    if (!phone || !password) { L.error = 'يرجى إدخال رقم الهاتف وكلمة المرور'; render(); return; }
    let user = users.find(u => u.phone === phone && u.passwordHash === password);
    if (!user) {
      /* Local cache on this device might just be a bit behind the server — e.g. an account
         created moments ago on the admin's device hasn't reached this device yet. Refresh once
         from Supabase and retry before telling the person their login is wrong. */
      await pullAllFromSupabase();
      users = DB.getUsers();
      user = users.find(u => u.phone === phone && u.passwordHash === password);
    }
    if (user) {
      setCurrentUser(user);
      if (user.role === 'admin') navigate('/admin');
      else if (user.role === 'reviewer') navigate('/reviewer');
      else if (user.role === 'account_manager') navigate('/account-manager');
      else navigate('/dashboard');
    } else {
      L.error = 'بيانات الدخول غير صحيحة';
      render();
    }
  } else {
    const name = (document.getElementById('reg-name').value || '').trim();
    const age = document.getElementById('reg-age').value;
    const dailyHours = (document.getElementById('reg-hours').value || '').trim();
    const facebook = (document.getElementById('reg-facebook').value || '').trim();
    
    const jobRole = UI.login.jobRole || 'content_creator';
    const initialStatus = (jobRole === 'content_creator') ? 'pending_approval' : 'waiting';

    let extraAnswers = {};

    if (jobRole === 'content_creator') {
      const hasExp = L.hasExperience;
      extraAnswers = {
        hasExperience: hasExp,
        experience: hasExp ? (document.getElementById('reg-exp').value || '').trim() : '',
        yearsOfExperience: hasExp ? Number(document.getElementById('reg-years').value) : 0,
        portfolioLink: hasExp ? (document.getElementById('reg-portfolio').value || '').trim() : '',
        platforms: (document.getElementById('reg-platforms').value || '').trim(),
        trendIdea: (document.getElementById('reg-trend').value || '').trim()
      };
    } else if (jobRole === 'video_editor') {
      extraAnswers = {
        portfolioLink: (document.getElementById('reg-portfolio').value || '').trim(),
        software: (document.getElementById('reg-software').value || '').trim(),
        speed: (document.getElementById('reg-speed').value || '').trim()
      };
    } else if (jobRole === 'graphic_designer') {
      extraAnswers = {
        portfolioLink: (document.getElementById('reg-portfolio').value || '').trim(),
        software: (document.getElementById('reg-software').value || '').trim(),
        specialty: (document.getElementById('reg-specialty').value || '').trim()
      };
    } else if (jobRole === 'media_buyer') {
      extraAnswers = {
        adPlatforms: (document.getElementById('reg-ad-platforms').value || '').trim(),
        budget: (document.getElementById('reg-budget').value || '').trim(),
        analytics: (document.getElementById('reg-analytics').value || '').trim()
      };
    } else if (jobRole === 'youtube') {
      extraAnswers = {
        channels: (document.getElementById('reg-channels').value || '').trim(),
        ytTasks: (document.getElementById('reg-yt-tasks').value || '').trim(),
        eduExp: (document.getElementById('reg-edu-exp').value || '').trim()
      };
    }

    if (!phone || !password || !name || !age || !dailyHours) { L.error = 'يرجى إكمال جميع الحقول الأساسية المطلوبة'; render(); return; }

    const newUser = Object.assign({
      id: 'user_' + Date.now(),
      phone, passwordHash: password, role: 'candidate',
      name, age: Number(age), dailyHours, facebookLink: facebook, photo: L.photoData || '',
      status: initialStatus, jobRole: jobRole, currentDay: 1, dayStartTime: null,
      assignedAmId: pickLeastLoadedAccountManager() || '',
    }, extraAnswers);

    DB.upsertUser(newUser);
    L.photoData = '';
    L.successMsg = (jobRole === 'content_creator') 
      ? 'جاري مراجعة الاكونت وهيتم التواصل معاك واتساب' 
      : 'تم تسجيل بياناتك بنجاح في قائمة الانتظار وستصلك التفاصيل عند فتح الشاغر';
L.isLogin = true;
    L.hasExperience = false;
    render();
  }
}

function renderCandidateDashboard(sessionUser) {

        '</div>' +
      '</main>';
  }
  if (user.status === 'waiting') {
    return DashboardHeader({ user: user }) +
      '<main class="max-w-3xl mx-auto px-4 mt-8">' +
        '<div class="bg-white border border-brand-blue/30 rounded-2xl p-12 text-center">' +
          '<div class="w-20 h-20 bg-brand-blue/10 text-brand-blue rounded-full flex items-center justify-center mx-auto mb-6">' + icon('list', 'w-10 h-10') + '</div>' +
          '<h2 class="text-3xl font-bold text-brand-dark mb-4">تم تسجيل بياناتك بنجاح</h2>' +
          '<p class="text-gray-600 text-lg">الوظيفة اللي قدمت عليها (' + esc(jobRoleLabel(user.jobRole)) + ') مش بتحتاج اختبار تدريب حالياً. بياناتك معانا في قائمة الانتظار، وسيتم التواصل معك على الواتساب أول ما يكون فيه فرصة تناسبك.</p>' +
        '</div>' +
      '</main>';
  }
  if (user.status === 'rejected') {
    return DashboardHeader({ user: user }) +
      '<main class="max-w-3xl mx-auto px-4 mt-8">' +
        '<div class="bg-white border border-danger/30 rounded-2xl p-12 text-center">' +
          '<div class="w-20 h-20 bg-danger/10 text-danger rounded-full flex items-center justify-center mx-auto mb-6">' + icon('alertTriangle', 'w-10 h-10') + '</div>' +

        '</div>' +
      '</main>';
  }

  const task = tasks.find(t => t.day === user.currentDay) || null;
  const submission = submissions.find(s => s.userId === user.id && s.day === user.currentDay) || null;
  const isDayFinished = tasks.length === 0 ? false : (user.currentDay > tasks.length || (user.currentDay === tasks.length && submission));
  const trainer = users.find(u => u.id === user.reviewerId);

  let html = DashboardHeader({ subtitle: 'مرحباً، ' + user.phone, user: user }) + '<main class="max-w-3xl mx-auto px-4 mt-8">';

function handleStartDay(userId) {
  const users = DB.getUsers();
  const user = users.find(u => u.id === userId);
  if (!user) return;
  user.dayStartTime = Date.now();
  DB.upsertUser(user);
  setCurrentUser(user);
  render();
}

function handleSubmitTask(e, userId) {
  e.preventDefault();
  const driveLink = document.getElementById('drive-link').value;
  if (!driveLink) return;
  const users = DB.getUsers();
  const tasks = DB.getTasks();
  const user = users.find(u => u.id === userId);
  if (!user) return;

  const newSubmission = { id: 'sub_' + Date.now(), userId: user.id, day: user.currentDay, driveLink, submittedAt: Date.now(), status: 'pending' };
  DB.upsertSubmission(newSubmission);

  if (user.currentDay < tasks.length) {
    user.currentDay += 1;
    user.dayStartTime = null;
    DB.upsertUser(user);
    setCurrentUser(user);
  } else {
    setCurrentUser(user);
  }
  render();
}

function startCandidateTimer(sessionUser) {
  const box = document.getElementById('countdown-box');
  if (!box) return;
  function tick() {
    const users = DB.getUsers();
    const user = users.find(u => u.id === sessionUser.id);
    const submissions = DB.getSubmissions();
    const submission = submissions.find(s => s.userId === user.id && s.day === user.currentDay);
    if (!user || !user.dayStartTime || submission) return;
    const deadline = user.dayStartTime + 12 * 60 * 60 * 1000;
    const remaining = deadline - Date.now();
    const textEl = document.getElementById('countdown-text');
    if (!textEl) return;
    if (remaining <= 0) {
      clearInterval(activeInterval);
      render();
      return;
    }
    const totalSec = Math.floor(remaining / 1000);
    const h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = totalSec % 60;
    const pad = n => String(n).padStart(2, '0');
    textEl.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
    if (h < 2) {
      box.classList.remove('bg-brand-blue/10', 'border-brand-blue/30', 'text-brand-blue');
      box.classList.add('bg-danger/10', 'border-danger/50', 'text-danger');
    }
  }
  tick();
  activeInterval = setInterval(tick, 1000);
}

async function handleDeleteUser(userId) {
  if (!confirm('هل أنت متأكد من مسح حساب المتدرب؟ لن يمكن استرجاع بياناته.')) return;
  const deleted = await pushDelete('users', userId);
  if (!deleted) {
    alert('الحذف لم يتم على السيرفر (تأكد من الاتصال بالإنترنت)، فالحساب لسه موجود فعلياً. حاول تاني، ولو المشكلة استمرت متعمليش حساب جديد بنفس الرقم لحد ما تتأكد إن القديم اتمسح خالص.');
    return;
  }
  DB.saveUsers(DB.getUsers().filter(u => u.id !== userId));
  rerender();
}

/* Impersonate: admin views the app as another user. Stores admin session so they can return. */
function handleImpersonate(userId) {
  const users = DB.getUsers();
  const target = users.find(u => u.id === userId);
  if (!target) return;
  const adminSession = getCurrentUser();
  // Save admin session under a separate key so we can restore it
  localStorage.setItem('atoz_impersonating_as_admin', JSON.stringify(adminSession));
  setCurrentUser(target);
  if (target.role === 'admin') navigate('/admin');
  else if (target.role === 'reviewer') navigate('/reviewer');
  else if (target.role === 'account_manager') navigate('/account-manager');
  else navigate('/dashboard');
}

function handleStopImpersonating() {
  const adminSession = localStorage.getItem('atoz_impersonating_as_admin');
  if (!adminSession) { doLogout(); return; }
  try {
    const admin = JSON.parse(adminSession);
    localStorage.removeItem('atoz_impersonating_as_admin');
    setCurrentUser(admin);
    navigate('/admin');
  } catch (e) { doLogout(); }
}

function handleApproveCandidate(userId) {
  const allUsers = DB.getUsers();
  const reviewers = DB.getReviewers();
  const u = allUsers.find(user => user.id === userId);
  if (!u) return;

  // If the candidate was pre-assigned to an AM, try that AM's org first (with overflow to
  // another AM if that org is full); otherwise fall back to least-loaded across all reviewers.
  let assignedReviewerId;
  const assignedAm = u.assignedAmId ? reviewers.find(r => r.id === u.assignedAmId) : null;

  if (assignedAm) {
    assignedReviewerId = findAssignmentAcrossOrgs(assignedAm.id, allUsers, reviewers);
  } else {
    // No AM assigned — fall back to least-loaded reviewer across all
    const activeCandidates = allUsers.filter(u2 => u2.status === 'approved');
    const reviewerCounts = {};
    reviewers.forEach(r => reviewerCounts[r.id] = 0);
    activeCandidates.forEach(c => { if (c.reviewerId && reviewerCounts[c.reviewerId] !== undefined) reviewerCounts[c.reviewerId]++; });
    assignedReviewerId = reviewers[0] ? reviewers[0].id : undefined;
    let minCount = Infinity;
    Object.keys(reviewerCounts).forEach(rId => { if (reviewerCounts[rId] < minCount) { minCount = reviewerCounts[rId]; assignedReviewerId = rId; } });
  }

  u.status = 'approved'; u.reviewerId = assignedReviewerId; DB.upsertUser(u); openWhatsappMessage(u.phone, congratsWaMessage(u.name));
  rerender();
}
function handleRejectCandidate(userId) {
  const u = DB.getUsers().find(user => user.id === userId);
  if (u) { u.status = 'rejected'; DB.upsertUser(u); openWhatsappMessage(u.phone, rejectWaMessage(u.name)); }
  rerender();
}

async function handleAddReviewer() {
  const name = document.getElementById('new-rev-name').value.trim();
  const phone = document.getElementById('new-rev-phone').value.trim();
  const password = document.getElementById('new-rev-password').value.trim();
  const role = UI.adminReviewers.role;
  const managerSelect = document.getElementById('new-rev-manager');
  const managerId = managerSelect ? managerSelect.value : '';

  if (!name || !phone || !password) return;
  const users = DB.getUsers();
  if (users.find(u => u.phone === phone)) { alert('رقم الهاتف مسجل بالفعل'); return; }

  const revId = 'rev_' + Date.now();
  const newReviewer = { id: revId, name, isAccountManager: role === 'account_manager' };
  if (role === 'reviewer' && managerId) newReviewer.managerId = managerId;

  const revSaved = await DB.upsertReviewer(newReviewer);
  const userSaved = await DB.upsertUser({ id: revId, phone, passwordHash: password, role, name, currentDay: 1 });

  if (!revSaved || !userSaved) {
    alert('البيانات اتحفظت على الجهاز ده بس، ولسه ما وصلتش للسيرفر (ممكن يكون في مشكلة في النت). لو قفلت وفتحت تاني دلوقتي ممكن تلاقيه اختفى. اتأكد من الاتصال بالإنترنت وحاول تضيفه تاني.');
  }

  UI.adminReviewers.isAdding = false;
  UI.adminReviewers.role = 'reviewer';
  rerender();
}
async function handleDeleteReviewer(id) {
  if (!confirm('هل أنت متأكد من مسح هذا الحساب؟ لن يمكن استرجاع بياناته، وهيتم تحرير رقم الهاتف بتاعه عشان يقدر يتسجل بيه تاني لو حصل.')) return;
  const revDeleted = await pushDelete('reviewers', id);
  const userDeleted = await pushDelete('users', id);
  if (!revDeleted || !userDeleted) {
    alert('الحذف لم يتم بالكامل على السيرفر (تأكد من الاتصال بالإنترنت)، فالحساب لسه موجود فعلياً هناك. حاول تاني، ولو المشكلة استمرت متعمليش حساب جديد بنفس رقم التليفون لحد ما تتأكد إن القديم اتمسح خالص — عشان كدا كانت بتظهر رسالة "الرقم مسجل بالفعل" حتى بعد ما بيبان إنه اتمسح.');
    return;
  }
  DB.saveReviewers(DB.getReviewers().filter(r => r.id !== id));
  DB.saveUsers(DB.getUsers().filter(u => u.id !== id));
  rerender();
}

function formatFollowers(n) {
  n = Number(n) || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

async function handleTeacherPhotoSelected(e) {
  const file = e.target.files && e.target.files[0];
  const statusEl = document.getElementById('teacher-photo-status');
  const previewEl = document.getElementById('teacher-photo-preview');
  UI.adminTeachers.photoData = '';
  if (!file) return;
  if (statusEl) { statusEl.textContent = 'جاري ضغط الصورة...'; statusEl.className = 'text-xs text-gray-500 mt-2'; }
  try {
    const compressed = await compressImageFile(file);
    if (compressed && compressed.length > PHOTO_MAX_BASE64_CHARS) {
      if (statusEl) { statusEl.textContent = 'الصورة كبيرة جداً حتى بعد الضغط، اختار صورة أصغر.'; statusEl.className = 'text-xs text-danger mt-2 font-medium'; }
      e.target.value = '';
      return;
    }
    UI.adminTeachers.photoData = compressed || '';
    if (statusEl) { statusEl.textContent = 'تم تجهيز الصورة بنجاح ✓'; statusEl.className = 'text-xs text-success mt-2 font-medium'; }
    if (previewEl) previewEl.innerHTML = '<img src="' + compressed + '" class="w-16 h-16 rounded-full object-cover border border-gray-200">';
  } catch (err) {
    if (statusEl) { statusEl.textContent = 'تعذر تجهيز الصورة، جرب صورة تانية.'; statusEl.className = 'text-xs text-danger mt-2 font-medium'; }
    e.target.value = '';
  }
}

function renderReviewerDashboard(sessionUser) {
  const users = DB.getUsers();

  const mySubmissions = submissions.filter(s => assignedIds.includes(s.userId));
  const pendingReviewCount = mySubmissions.filter(s => s.status === 'pending').length;
  const reviewedSubmissions = mySubmissions.filter(s => s.status === 'reviewed' && typeof s.score === 'number');
  const avgScore = reviewedSubmissions.length ? (reviewedSubmissions.reduce((sum, s) => sum + s.score, 0) / reviewedSubmissions.length) : null;

  let html = DashboardHeader({ subtitle: 'لوحة تحكم التيم ليدر', user: currentUser }) +
    '<div class="max-w-7xl mx-auto space-y-8 p-4 md:p-8">' +
    '<div><h1 class="font-display text-2xl font-bold text-brand-dark">مرحباً، ' + esc(currentUser.name) + '</h1>' +
    '<p class="text-gray-500 mt-1">تقدر تراجع وتقيّم شغل المتدربين التابعين لك من هنا</p></div>' +
    '<div class="grid grid-cols-1 md:grid-cols-3 gap-4">' +
      '<div class="bg-[#f8f9fa] border border-brand-dark/10 rounded-2xl p-6 flex flex-col justify-center items-center"><span class="text-gray-600 text-sm mb-1">المتدربين التابعين لك</span><span class="text-3xl font-bold text-brand-dark">' + assignedCandidates.length + '</span></div>' +
      '<div class="' + (pendingReviewCount > 0 ? 'bg-orange-50 border-orange-300' : 'bg-[#f8f9fa] border-brand-dark/10') + ' border rounded-2xl p-6 flex flex-col justify-center items-center">' +
        '<span class="text-gray-600 text-sm mb-1">تسليمات في انتظار تقييمك</span>' +
        '<span class="text-3xl font-bold ' + (pendingReviewCount > 0 ? 'text-orange-500' : 'text-brand-dark') + '">' + pendingReviewCount + '</span>' +
      '</div>' +
      '<div class="bg-[#f8f9fa] border border-brand-dark/10 rounded-2xl p-6 flex flex-col justify-center items-center"><span class="text-gray-600 text-sm mb-1">متوسط الدرجة اللي بتدّيها</span><span class="text-3xl font-bold text-green-500">' + (avgScore !== null ? avgScore.toFixed(1) + '/10' : '-') + '</span></div>' +
    '</div>' +
    '<div class="bg-white border border-brand-dark/10 rounded-2xl overflow-hidden">' +
    '<div class="p-6 border-b border-brand-dark/10"><h2 class="text-xl font-bold text-brand-dark">المتدربين التابعين لك (' + assignedCandidates.length + ')</h2></div>' +
    '<div class="overflow-x-auto"><table class="w-full text-right"><thead class="bg-gray-50 text-gray-600 text-sm"><tr>' +
    '<th class="px-6 py-4 font-medium">الاسم / الرقم</th><th class="px-6 py-4 font-medium">اليوم الحالي</th><th class="px-6 py-4 font-medium">آخر تسليم</th><th class="px-6 py-4 font-medium">التقييم</th><th class="px-6 py-4 font-medium">الإجراءات</th>' +
    '</tr></thead><tbody class="divide-y divide-white/5">';

  if (assignedCandidates.length === 0) {
    html += '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">لا يوجد متدربين مخصصين لك حالياً</td></tr>';
  } else {
    assignedCandidates.forEach(user => {
      html += renderTraineeRow(user, submissions, tasks);
    });
  }
  html += '</tbody></table></div></div></div>';

function renderTraineeRow(user, submissions, tasks) {
  const userSubmissions = submissions.filter(s => s.userId === user.id);
  const latestSubmission = userSubmissions.length > 0 ? userSubmissions.reduce((prev, cur) => (prev.day > cur.day ? prev : cur)) : null;
  const currentTask = tasks.find(t => t.day === user.currentDay);

  let html = '<tr class="hover:bg-[#f8f9fa] transition-colors">' +
    '<td class="px-6 py-4">' + profileTriggerHtml(user, '<div class="flex items-center gap-3">' + avatarHtml(user) + '<div><div class="font-bold text-brand-dark">' + esc(user.name) + '</div><div class="text-gray-600 text-sm font-mono" dir="ltr">' + esc(user.phone) + '</div></div></div>') + '<div class="mt-2">' + socialButtonsHtml(user) + '</div></td>' +
    '<td class="px-6 py-4"><div class="text-brand-blue font-medium">اليوم ' + user.currentDay + '</div><div class="text-gray-600 text-sm">' + esc(currentTask ? currentTask.title : '') + '</div></td>' +
    '<td class="px-6 py-4">';
  if (latestSubmission) {
    html += '<div class="space-y-1"><a href="' + esc(latestSubmission.driveLink) + '" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-500 hover:underline">' +
      '<span>رابط التسليم (اليوم ' + latestSubmission.day + ')</span>' + icon('externalLink', 'w-3 h-3') + '</a>' +
      '<div class="text-xs text-gray-500">' + fmtDate(latestSubmission.submittedAt) + '</div></div>';
  } else {
    html += '<span class="text-gray-500">لم يسلم بعد</span>';
  }
  html += '</td><td class="px-6 py-4">';
  if (latestSubmission && latestSubmission.status === 'reviewed') {
    html += '<div class="flex items-center gap-2 text-green-600">' + icon('check', 'w-4 h-4') + '<span class="font-bold">' + latestSubmission.score + '/10</span></div>';
  } else if (latestSubmission) {
    html += '<span class="text-yellow-600 text-sm">في انتظار التقييم</span>';
  } else {
    html += '<span class="text-gray-500">-</span>';
  }
  html += '</td><td class="px-6 py-4">';
  if (latestSubmission && latestSubmission.status === 'pending') {
    html += '<div class="flex flex-wrap gap-2 items-center">' +
      '<input type="number" min="0" max="10" placeholder="الدرجة" class="w-20 bg-gray-50 border border-brand-dark/10 rounded-lg px-2 py-1 text-brand-dark focus:outline-none focus:border-brand-light text-center" id="score-' + latestSubmission.id + '">' +
      '<input type="text" placeholder="ملاحظات..." class="w-40 bg-gray-50 border border-brand-dark/10 rounded-lg px-2 py-1 text-brand-dark focus:outline-none focus:border-brand-light" id="feedback-' + latestSubmission.id + '">' +
      '<button onclick="handleInlineReview(\'' + latestSubmission.id + '\')" class="p-1.5 bg-brand-light text-brand-dark hover:bg-[#f8f9fa] rounded-lg transition-colors font-medium text-sm">تقييم</button>' +
    '</div>';
  }
  html += '</td></tr>';
  return html;
}

function handleInlineReview(submissionId) {
  const scoreInput = document.getElementById('score-' + submissionId);
  const feedbackInput = document.getElementById('feedback-' + submissionId);
  if (!scoreInput.value) return;
  const subs = DB.getSubmissions();
  const s = subs.find(sub => sub.id === submissionId);
  if (s) { s.status = 'reviewed'; s.score = Number(scoreInput.value); s.feedback = feedbackInput.value; DB.upsertSubmission(s); }
  rerender();
}

/* ============================================================
   ACCOUNT MANAGER DASHBOARD
   ============================================================ */
function renderAccountManagerDashboard(sessionUser) {
  const users = DB.getUsers();
  const submissions = DB.getSubmissions();
  const tasks = DB.getTasks();
  const reviewers = DB.getReviewers();
  const currentUser = users.find(u => u.id === sessionUser.id) || sessionUser;

      '<button onclick="UI.accountManager.activeTab=\'my_leaders\'; rerender();" class="px-4 py-2 rounded-lg font-medium transition-colors ' + (AM.activeTab === 'my_leaders' ? 'bg-brand-light text-brand-dark' : 'text-gray-600 hover:bg-[#f8f9fa] hover:text-brand-dark') + '">التيم ليدرز (' + myTeamLeaders.length + ')</button>' +
    '</div><div class="p-0">';

  if (AM.activeTab === 'pending') {
    html += '<div class="overflow-x-auto"><table class="w-full text-right"><thead class="bg-gray-50 text-gray-600 text-sm"><tr>' +
      '<th class="px-6 py-4 font-medium">الاسم / الرقم</th><th class="px-6 py-4 font-medium">الخبرة</th><th class="px-6 py-4 font-medium">فكرة التريند</th><th class="px-6 py-4 font-medium text-center">الإجراء</th>' +

    } else {

          '<td class="px-6 py-4">' + (user.hasExperience ? (
            '<div class="text-brand-dark max-w-xs truncate" title="' + esc(user.experience) + '">' + esc(user.experience) + '</div><div class="text-sm text-brand-blue">' + esc(user.yearsOfExperience) + ' سنوات خبرة</div>' +
            (user.portfolioLink ? '<a href="' + esc(user.portfolioLink) + '" target="_blank" rel="noreferrer" class="text-xs text-blue-600 hover:underline mt-1 block">البورتفوليو</a>' : '')
          ) : '<div class="text-gray-500 text-sm">لا يوجد خبرة سابقة</div>') + '</td>' +
          '<td class="px-6 py-4"><div class="text-gray-700 max-w-xs truncate" title="' + esc(user.trendIdea) + '">' + esc(user.trendIdea) + '</div></td>' +
          '<td class="px-6 py-4"><div class="flex justify-center gap-2">' +
            '<button onclick="handleAMApprove(\'' + user.id + '\')" class="p-2 bg-green-500/20 text-green-600 hover:bg-green-500 hover:text-white rounded-lg transition-colors" title="قبول">' + icon('userCheck', 'w-5 h-5') + '</button>' +
            '<button onclick="handleRejectCandidate(\'' + user.id + '\')" class="p-2 bg-red-500/20 text-red-600 hover:bg-red-500 hover:text-white rounded-lg transition-colors" title="رفض">' + icon('userX', 'w-5 h-5') + '</button>' +

  } else if (AM.activeTab === 'my_team') {

    if (myTeamLeaders.length === 0) {

    } else {
      myTeamLeaders.forEach(leader => {

        // Leader header
        html += '<div class="p-4 bg-gray-50 border-b border-brand-dark/10 flex items-center justify-between">' +
          '<div class="flex items-center gap-3">' + avatarHtml(leaderUser || leader) +

          '<div class="text-sm text-brand-blue">تيم ليدر · يدرب ' + leaderCandidates.length + ' متدرب</div></div></div>' +

        if (leaderCandidates.length === 0) {

              '<td class="px-4 py-3"><div class="text-brand-blue text-sm font-medium">اليوم ' + candidate.currentDay + '</div>' +

                '<div class="text-xs text-gray-500 mt-1">' + fmtDate(latestSub.submittedAt) + '</div>' :

  html += '</div></div></div>';

/* Average workload per person in an account manager's org: everyone approved under their whole org
   (themselves + their team leaders) plus any pending applications already routed to them and awaiting
   a decision, divided by the org size (AM + their team leaders). This is per-capita on purpose — an AM
   with 2 team leaders can absorb proportionally more total candidates than an AM with only 1 team leader
   before being considered equally "loaded", since the same total gets split over more people. */
function computeAmLoad(amId) {
  const users = DB.getUsers();
  const reviewers = DB.getReviewers();
  const teamLeaderIds = reviewers.filter(r => r.managerId === amId).map(r => r.id);
  const orgIds = [amId].concat(teamLeaderIds);
  const approvedCount = users.filter(u => u.status === 'approved' && orgIds.includes(u.reviewerId)).length;
  const pendingAssignedCount = users.filter(u => u.status === 'pending_approval' && u.assignedAmId === amId).length;
  const orgSize = orgIds.length; // AM + their team leaders
  return (approvedCount + pendingAssignedCount) / orgSize;
}
function pickLeastLoadedAccountManager() {
  const reviewers = DB.getReviewers();
  const accountManagers = reviewers.filter(r => r.isAccountManager);
  if (accountManagers.length === 0) return null;
  let bestId = accountManagers[0].id;
  let bestLoad = computeAmLoad(bestId);
  accountManagers.forEach(am => {
    const load = computeAmLoad(am.id);
    if (load < bestLoad) { bestLoad = load; bestId = am.id; }
  });
  return bestId;
}

/* Try to place a candidate within one AM's org (their TLs, then the AM last — TLs win ties).
   Respects each TL's TL_DIRECT_CAP and the AM's own computeAmDirectCap. Returns a reviewerId,
   or null if everyone in this org (AM + all TLs) is already at their cap. */
function findAssignmentInOrg(amId, allUsers, reviewers) {
  const amTeamLeaders = reviewers.filter(r => r.managerId === amId);
  const amReviewer = reviewers.find(r => r.id === amId);
  const allTrainers = amTeamLeaders.concat(amReviewer ? [amReviewer] : []);
  if (allTrainers.length === 0) return null;

  const activeCandidates = allUsers.filter(u => u.status === 'approved' && allTrainers.map(t => t.id).includes(u.reviewerId));
  const reviewerCounts = {};
  allTrainers.forEach(r => reviewerCounts[r.id] = 0);
  activeCandidates.forEach(c => { if (c.reviewerId && reviewerCounts[c.reviewerId] !== undefined) reviewerCounts[c.reviewerId]++; });

  const amCap = computeAmDirectCap(amId);
  let bestId = null;
  let bestLoad = Infinity;
  allTrainers.forEach(trainer => {
    const isAM = trainer.id === amId;
    const cap = isAM ? amCap : TL_DIRECT_CAP;
    const count = reviewerCounts[trainer.id] || 0;
    if (count >= cap) return; // this trainer is full, skip them
    if (count < bestLoad) { bestLoad = count; bestId = trainer.id; }
  });
  return bestId; // null means every trainer in this org is at cap
}

/* Entry point for assigning a candidate: try the preferred AM's org first; if that whole org is
   full (AM + all TLs at cap), overflow to the next least-loaded AM's org instead, so nobody sits
   pending or gets piled onto someone past their cap. If literally every AM's org is full, fall
   back to whoever overall has the lowest count (ignoring caps) so the candidate is never left
   unassigned. */
function findAssignmentAcrossOrgs(preferredAmId, allUsers, reviewers) {
  const accountManagers = reviewers.filter(r => r.isAccountManager);
  const otherAmIds = accountManagers.map(am => am.id)
    .filter(id => id !== preferredAmId)
    .sort((a, b) => computeAmLoad(a) - computeAmLoad(b));
  const amOrder = preferredAmId ? [preferredAmId].concat(otherAmIds) : otherAmIds;

  for (const amId of amOrder) {
    const result = findAssignmentInOrg(amId, allUsers, reviewers);
    if (result) return result;
  }

  // Last resort: every org is completely full — assign to whoever overall has the lowest count.
  let bestId = reviewers[0] ? reviewers[0].id : undefined;
  let bestLoad = Infinity;
  reviewers.forEach(r => {
    const count = allUsers.filter(u => u.status === 'approved' && u.reviewerId === r.id).length;
    if (count < bestLoad) { bestLoad = count; bestId = r.id; }
  });
  return bestId;
}

/* AM direct cap computed dynamically via computeAmDirectCap(amId) */

function handleAMApprove(userId) {
  const sessionUser = getCurrentUser();
  const users = DB.getUsers();
  const reviewers = DB.getReviewers();

  const assignedReviewerId = findAssignmentAcrossOrgs(sessionUser.id, users, reviewers);
  if (!assignedReviewerId) return;

  const u = users.find(user => user.id === userId);
  if (u) { u.status = 'approved'; u.reviewerId = assignedReviewerId; DB.upsertUser(u); openWhatsappMessage(u.phone, congratsWaMessage(u.name)); }
  rerender();
}
